name: Deploy Node App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Application
        run: |
          cd /var/www/node-pm2

          git pull origin main
          npm install --production

          APP_NAME="node-pm2"
          ENTRY_FILE="index.js"

          # Delete old fork-mode app if exists
          pm2 delete $APP_NAME || true

          # Start in cluster mode
          pm2 start $ENTRY_FILE -i 4 --name $APP_NAME

          pm2 save